# ponytail: fixed resource limits configured; upgrade to environment variable overrides when multi-cluster sizing is required.
services:
  migration:
    image: ghcr.io/gecut/persianpartshop.ir/cms:${CMS_TAG:-${TAG:-latest}}
    restart: "no"
    command: ["./node_modules/.bin/payload", "migrate"]
    environment:
      DATABASE_URI: ${DATABASE_URI:-${DATABASE_URL:-postgresql://postgres:8228@postgres:5432/persianpart_cms}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super-secret-payload-key-must-be-at-least-32-chars-long}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 256M
    networks:
      - dokploy-network

  api:
    image: ghcr.io/gecut/persianpartshop.ir/api:${API_TAG:-${TAG:-latest}}
    restart: unless-stopped
    command: ["bun", "run", "apps/api/src/server.ts"]
    expose:
      - "5175"
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5175
      HOST: 0.0.0.0
      DATABASE_URI: ${DATABASE_URI:-${DATABASE_URL:-postgresql://postgres:8228@postgres:5432/persianpart_cms}}
      DATABASE_URL: ${DATABASE_URL:-${DATABASE_URI:-postgresql://postgres:8228@postgres:5432/persianpart_cms}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super-secret-payload-key-must-be-at-least-32-chars-long}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-session-key-must-be-32-chars-long}
      CMS_URL: ${CMS_URL:-https://${CMS_DOMAIN:-admin.persianpart.shop}}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${CMS_DOMAIN:-admin.persianpart.shop},https://${WEB_DOMAIN:-persianpart.shop},https://${API_DOMAIN:-api.persianpart.shop},http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-46437751615871547A59364B75376339706E72384266734A596F3476644B653641356171462F557A5747383D}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-gcotp}
      MEDIA_DIR: /app/media
    volumes:
      - persianpart_media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5175/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 256M
    networks:
      - dokploy-network

  cms:
    image: ghcr.io/gecut/persianpartshop.ir/cms:${CMS_TAG:-${TAG:-latest}}
    restart: unless-stopped
    command: ["./node_modules/.bin/next", "start", "-p", "5174"]
    expose:
      - "5174"
    depends_on:
      migration:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5174
      DATABASE_URI: ${DATABASE_URI:-${DATABASE_URL:-postgresql://postgres:8228@postgres:5432/persianpart_cms}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super-secret-payload-key-must-be-at-least-32-chars-long}
      NEXT_PUBLIC_SERVER_URL: ${CMS_URL:-https://${CMS_DOMAIN:-admin.persianpart.shop}}
    volumes:
      - persianpart_media_data:/app/apps/cms/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5174/admin').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      - dokploy-network

  web:
    image: ghcr.io/gecut/persianpartshop.ir/web:${WEB_TAG:-${TAG:-latest}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dokploy-network

  cdn:
    image: ${CDN_IMAGE:-ghcr.io/gecut/nginx/cdn}:${CDN_TAG:-2.0.0}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      NGINX_CORS_ENABLE: "on"
      NGINX_CORS_ORIGIN: "*"
    volumes:
      - persianpart_media_data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/server-info || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - dokploy-network

volumes:
  persianpart_media_data:
    name: persianpart_media_data

networks:
  dokploy-network:
    external: true
