# Lean starting resource budgets; validate peak memory and latency on the target server.
# Startup: migration -> CMS -> API/Catalog. No host ports; Dokploy handles public routing.
services:
  migration:
    image: ghcr.io/gecut/persianpartshop.ir/cms:${CMS_TAG:-${TAG:-latest}}
    restart: "no"
    command: ["pnpm", "--filter", "@persianpart/cms", "migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:8228@postgres:5432/persianpart_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super-secret-payload-key-must-be-at-least-32-chars-long}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    networks:
      - dokploy-network

  api:
    image: ghcr.io/gecut/persianpartshop.ir/api:${API_TAG:-${TAG:-latest}}
    restart: unless-stopped
    command: ["bun", "run", "apps/api/src/server.ts"]
    expose:
      - "5175"
    depends_on:
      migration:
        condition: service_completed_successfully
      cms:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5175
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:8228@postgres:5432/persianpart_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super-secret-payload-key-must-be-at-least-32-chars-long}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-session-key-must-be-32-chars-long}
      CMS_URL: http://persianpart-cms:5174
      CMS_API_URL: http://persianpart-cms:5174/api
      CMS_API_KEY: ${CMS_API_KEY}
      CDN_URL: ${CDN_URL:-https://${CDN_DOMAIN:-cdn.persianpart.shop}}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${CMS_DOMAIN:-admin.persianpart.shop},https://${WEB_DOMAIN:-persianpart.shop},https://${API_DOMAIN:-api.persianpart.shop},https://${CDN_DOMAIN:-cdn.persianpart.shop},http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
      MEDIA_DIR: /app/media
      OFFLINE_SNAPSHOTS_ENABLED: ${OFFLINE_SNAPSHOTS_ENABLED:-false}
    volumes:
      - persianpart_media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5175/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    networks:
      backend:
        aliases: [persianpart-api]
      dokploy-network: {}

  cms:
    image: ghcr.io/gecut/persianpartshop.ir/cms:${CMS_TAG:-${TAG:-latest}}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@persianpart/cms", "start"]
    expose:
      - "5174"
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5174
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      WEB_URL: ${WEB_URL:-https://${WEB_DOMAIN:-persianpart.shop}}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:8228@postgres:5432/persianpart_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super-secret-payload-key-must-be-at-least-32-chars-long}
      CMS_MCP_ENABLED: ${CMS_MCP_ENABLED:-true}
      NEXT_PUBLIC_SERVER_URL: ${CMS_URL:-https://${CMS_DOMAIN:-admin.persianpart.shop}}
      CDN_URL: ${CDN_URL:-https://${CDN_DOMAIN:-cdn.persianpart.shop}}
      CATALOG_URL: ${CATALOG_URL:-https://${CATALOG_DOMAIN:-catalog.persianpartshop.ir}}
    volumes:
      - persianpart_media_data:/app/apps/cms/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5174/admin').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.10"
          memory: 256M
    networks:
      backend:
        aliases: [persianpart-cms]
      dokploy-network: {}

  catalog:
    image: ghcr.io/gecut/persianpartshop.ir/catalog:${CATALOG_TAG:-${TAG:-latest}}
    restart: unless-stopped
    expose:
      - "5176"
    depends_on:
      cms:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5176
      HOSTNAME: 0.0.0.0
      CATALOG_URL: ${CATALOG_URL:-https://${CATALOG_DOMAIN:-catalog.persianpartshop.ir}}
      CMS_API_URL: http://persianpart-cms:5174/api
      CMS_API_KEY: ${CMS_API_KEY:?Set the existing active CMS service API key}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5176/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    networks:
      backend: {}
      dokploy-network: {}

  web:
    image: ghcr.io/gecut/persianpartshop.ir/web:${WEB_TAG:-${TAG:-latest}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.01"
          memory: 32M
    networks:
      - dokploy-network

  cdn:
    image: ${CDN_IMAGE:-ghcr.io/gecut/nginx/cdn}:${CDN_TAG:-2.0.0}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    environment:
      NGINX_CORS_ENABLE: "on"
      NGINX_CORS_ORIGIN: "*"
    volumes:
      - persianpart_media_data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/server-info || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.01"
          memory: 32M
    networks:
      - dokploy-network

volumes:
  persianpart_media_data:
    name: persianpart_media_data

networks:
  backend:
    driver: bridge
  dokploy-network:
    external: true
